{% extends 'base.html' %}{% block content %}<div class="header"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Usuarios</h1></div></div><section class="grid"><div class="card"><h2>Crear usuario</h2><form method="post"><label>Usuario<input name="username" required></label><label>Contraseña (mínimo 8 caracteres)<input type="password" name="password" minlength="8" required></label><label>Rol<select name="role"><option value="user">Usuario</option><option value="admin">Administrador</option></select></label><button>Crear cuenta</button></form></div><div class="card"><h2>Cuentas registradas</h2><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Creado</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{u.created_at[:10]}}</td></tr>{% endfor %}</tbody></table></div></div></section>{% endblock %}
